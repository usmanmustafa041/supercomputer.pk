name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: supercomputers
          POSTGRES_PASSWORD: supercomputers-ci
          POSTGRES_DB: supercomputers
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supercomputers -d supercomputers"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: supercomputers
      POSTGRES_PASSWORD: supercomputers-ci
      POSTGRES_DB: supercomputers
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-strong-password
      AUTH_ENCRYPTION_KEY: ci-only-encryption-key-at-least-32-characters
      APP_URL: http://localhost:3000
      CRON_SECRET: ci-only-maintenance-secret-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
