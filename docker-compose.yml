# The whole stack.
#
#   cp .env.example .env    then edit the secrets
#   docker compose up -d --build
#
# Website  http://localhost:3000
# MinIO console  http://localhost:9001
#
# Four services on two networks, and the split is the point.
#
#     browser --> web :3000 --> api :4000 --> db :5432
#                 [ edge ]      [ edge ]      [ data ]
#                               [ data ]  \-> minio :9000
#                                             [ data ]
#
# The web tier is on `edge` only. The database and the object store are on
# `data` only. The API is the one service on both, which is what makes it the
# only route between them. This is not a formality: with everything on one
# network the web container could still open a TCP socket to Postgres, and
# "it has no password" is a weaker guarantee than "there is no route".
#
# Only the web tier publishes a port. The rest are reachable from the host in
# development only, through the override file, so a database client can connect
# while working. Nothing in this file opens them.

name: supercomputers

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-supercomputers}
    volumes:
      # A named volume, so the data survives `docker compose down`.
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-supercomputers}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - miniodata:/data
    networks:
      - data
    ports:
      # The console only, for looking at what is in the bucket. The S3 API on
      # 9000 is deliberately not published: nothing outside this network has any
      # business talking to it.
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-supercomputers}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-product-images}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # The shared secret the web tier presents. Not a user credential: it says
      # "this request came from the web tier", nothing about who is signed in.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      # The administrator created on the first boot of an empty database.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@supercomputers.pk}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    depends_on:
      db:
        # Waits for Postgres to accept connections, not just to start.
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - edge
      - data
    # No ports. The API is reachable from the web tier and from nothing else.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # Note what is absent: no POSTGRES_*, no S3_*. This container has no
      # credentials for either, which is the whole point of the split.
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

networks:
  # The web tier and the API talk here. Nothing else joins it.
  edge:
    driver: bridge
  # The API, the database and the object store. The web tier is not on it, so
  # it has no route to either even before credentials come into it.
  data:
    driver: bridge

volumes:
  pgdata:
  miniodata:
